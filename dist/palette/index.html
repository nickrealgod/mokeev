<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OKLCH palette</title><style>
:root {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  color: #141414;
  background: var(--page-blocks, #fff);
  --panel: #f9f9f9;
  --line: #c0c0c0;
}
:root[data-theme="dark"] {
  color: #f9f9f9;
  --panel: #252525;
  --line: #636363;
}
* { box-sizing: border-box; }
body { margin: 0; }
button, input, summary { font: inherit; }
button, summary { cursor: pointer; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
[hidden] { display: none !important; }
.page-controls, #matrix { padding-inline: 40px; }
.page-controls { padding-top: 40px; }
#matrix { padding-block: 32px 64px; }
.controls-inner, .theme-inner { max-width: 1120px; margin-inline: auto; }
.inputs { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.hex-control { position: relative; margin-right: 12px; }
.hex-input {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 48px;
  padding: 0 4px 0 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
}
#input-swatch { width: 24px; height: 24px; border-radius: 6px; flex: none; }
#hex {
  width: 8ch;
  border: 0;
  background: transparent;
  color: inherit;
  font: 19px ui-monospace, monospace;
}
#hex[aria-invalid="true"], #error { color: var(--control-ink, currentColor); }
#error:empty { display: none; }
#gray-hue-label, #error { font-size: 13px; }
#gray-hue { width: 6ch; }
#hsl-toggle, .theme-toggle, .downloads summary {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--control-ink, currentColor);
}
.inputs svg {
  width: 24px;
  height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#hsl-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
.hsl-panel, .download-options, .color-hint {
  background: var(--panel);
  box-shadow: 0 10px 32px #0003;
  border: 1px solid var(--line);
  border-radius: 14px;
}
.hsl-panel, .download-options {
  position: absolute;
  z-index: 20;
  top: calc(100% + 8px);
}
.hsl-panel { left: 0; width: min(280px, calc(100vw - 40px)); padding: 16px; }
#sl-plane {
  position: relative;
  width: 100%;
  height: 180px;
  border-radius: 8px;
  background-image: linear-gradient(to bottom, #fff, transparent 50%, #000), linear-gradient(to right, #808080, transparent);
  touch-action: none;
  cursor: crosshair;
  overflow: hidden;
}
#sl-marker {
  position: absolute;
  width: 12px;
  height: 12px;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 1px #0006;
  transform: translate(-50%, -50%);
  pointer-events: none;
}
.picker-hue-label { display: block; margin-block: 10px 6px; font-size: 11px; }
#picker-hue {
  display: block;
  width: 100%;
  height: 12px;
  margin: 0 0 16px;
  border-radius: 12px;
  appearance: none;
  background: linear-gradient(to right, red, #ff0, #0f0, #0ff, #00f, #f0f, red);
}
#picker-hue::-webkit-slider-thumb {
  appearance: none;
  width: 15px;
  height: 15px;
  border: 2px solid #fff;
  border-radius: 50%;
  background: transparent;
  box-shadow: 0 0 0 1px #0005;
}
#picker-hue::-moz-range-thumb { border: 2px solid #fff; border-radius: 50%; background: transparent; }
.hsl-fields { display: flex; gap: 10px; font-size: 12px; }
.hsl-fields label { flex: 1; min-width: 0; }
.hsl-fields input {
  display: block;
  width: 100%;
  margin-top: 5px;
  padding: 7px;
  border: 1px solid var(--line);
  border-radius: 7px;
  color: inherit;
  background: transparent;
}
.neutral-control { border: 0; padding: 0; margin: 0; min-width: 0; }
.neutral-options { display: grid; grid-template-columns: repeat(6, 48px); gap: 6px; }
.hue-option { position: relative; cursor: pointer; }
.hue-option input { position: absolute; inset: 0; opacity: 0; margin: 0; width: 100%; height: 100%; cursor: pointer; }
.hue-option span { display: grid; place-items: center; height: 48px; border-radius: 12px; }
.hue-option input:focus-visible + span { outline: 2px solid currentColor; outline-offset: 2px; }
.hue-option input:checked + span::after {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.hue-option input:checked + span::after { background: #fff; box-shadow: 0 0 0 1px #0005; }
.downloads { position: relative; }
.downloads summary::-webkit-details-marker { display: none; }
.download-options { right: 0; padding: 4px; }
.download-options button { border: 0; padding: 10px 14px; background: transparent; color: inherit; }
h2 { font-size: 17px; margin: 0; }
#blocks-label { font-size: 12px; margin-block: 8px 14px; }
.matrix-scroll { overflow-x: auto; }
.matrix-table {
  width: 100%;
  min-width: 680px;
  border-spacing: 6px;
  table-layout: fixed;
}
.matrix-table td { text-align: center; vertical-align: middle; padding: 0; }
.matrix-function { font-size: 12px; line-height: 1.3; }
.hint-anchor { display: grid; gap: 4px; --preview: var(--sample); }
.matrix-swatch {
  width: 100%;
  min-height: 44px;
  padding: 8px;
  border: 1px solid var(--preview);
  border-radius: 10px;
  font-size: 11px;
}
.sample-outline { background: transparent; color: var(--preview); }
.sample-filled { background: var(--preview); color: var(--sample-ink); }
.matrix-swatch:focus-visible { outline-color: var(--control-ink); outline-offset: -3px; }
.hint-anchor.pinned, .hint-anchor:has(button:focus-visible) { --preview: var(--sample-max); }
@media (hover: hover) {
  .hint-anchor:has(button:hover) { --preview: var(--sample-max); }
  .hint-anchor:hover .color-hint { display: block; }
}
.color-hint {
  display: none;
  position: fixed;
  top: var(--hint-top, 12px);
  left: var(--hint-left, 12px);
  width: min(286px, calc(100vw - 24px));
  z-index: 30;
  padding: 12px;
  font-size: 12px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}
.color-hint p { margin: 8px 0 0; }
.hint-anchor:has(button:focus-visible) .color-hint, .hint-anchor.pinned .color-hint { display: block; }
.hint-anchor.suppressed .color-hint { display: none !important; }
@media (max-width: 560px) {
  .page-controls, #matrix { padding-inline: 20px; }
  .page-controls { padding-top: 24px; }
  .inputs { display: grid; grid-template-columns: minmax(0, 1fr) 44px 44px; gap: 8px 4px; }
  .hex-control { grid-column: 1 / -1; justify-self: start; margin-right: 0; }
  .neutral-options { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  .hue-option span { height: 44px; }
}
</style></head>

<script>

  const preview = hexFor(L, maximum, hue);
  const id = `hint-${rowId++}`;
  const anchor = document.createElement('div');
  anchor.className = 'hint-anchor';
  anchor.style.cssText = `--sample:${hex};--sample-max:${preview};--sample-ink:${tintedInk ?? background}`;
  const label = name + (isBlocks ? ' — use as Blocks background' : '');
  anchor.innerHTML = `<button type="button" class="matrix-swatch sample-outline"
      aria-label="${label}, Outline" aria-describedby="${id}">Outline</button>
    <button type="button" class="matrix-swatch sample-filled"
      aria-label="${label}, Filled" aria-describedby="${id}">Filled</button>

      <b>--${name}</b>

      <p>HEX <code>${hex}</code></p>
      <p>Maximum Chroma <code>${fmt(maximum)}</code></p>
      <p>WCAG / Blocks <code>${background}</code><br>${ratioText(hex, background)}</p>

    cell.textContent = [...new Set(names.map(name => roles.get(name)).filter(Boolean))].join(', ');
  }

  const rows = graySteps.flatMap(([step]) => {
    if (![['color-gray', 'color-neutral'], families].flat().some(family => roles.has(`${family}-${step}`))) return [];
    const row = document.createElement('tr');
    for (const group of [['color-gray', 'color-neutral'], families]) {
      const names = group.map(family => `${family}-${step}`);
      for (const name of names) {
        const cell = row.insertCell();
        const value = tokens.get(name);
        if (value && roles.has(name)) cell.append(matrixSample(name, value, background, alerts.get(name), alertInk.get(name)));
      }
      appendFunction(row, names);
    }
    return row;
  });

  for (const [name, value, label] of [
    ['color-white', tokens.get('color-white'), roles.get('color-white')],
    ['my-brand-color', [original[0] * 100, original[1], original[2]], 'Brand'],
  ]) {
    const row = document.createElement('tr');
    row.insertCell().append(matrixSample(name, value, background, alerts.get(name), alertInk.get(name)));
    row.insertCell();
    const cell = row.insertCell();
    cell.className = 'matrix-function';
    cell.textContent = label ?? '';
    row.insertCell().colSpan = families.length + 1;
    rows.push(row);
  }
  $('#matrix-rows').replaceChildren(...rows);
  $('#blocks-label').textContent = `Blocks background: --${blocksToken}`;
}

function matrixSample(name, value, background, alert, tintedInk) {
  const isBlocks = name === 'color-white' || name === 'color-gray-900';
  const anchor = makeColorHint(name, value, background, alert, isBlocks, tintedInk);
  if (isBlocks) {
    for (const button of anchor.querySelectorAll('button')) {
      const theme = name === 'color-white' ? 'light' : 'dark';
      button.dataset.blocks = name;
      button.setAttribute('aria-pressed', String(name === blocksForTheme[activeTheme]));
      button.onclick = () => {
        if (activeTheme === theme) {
          toggleHint(anchor);
          return;
        }
        setTheme(theme);
        document.querySelector(`[data-blocks="${name}"].${button.classList[1]}`).focus();
      };
    }
  }
  return anchor;
}

function render(restoreFocus){
  const input = $('#hex');
  const value = input.value.trim();
  const valid = /^#?(?:[a-f\d]{3}|[a-f\d]{6})$/i.test(value);
  $('#error').textContent = valid ? '' : 'Enter a HEX color, e.g. #EF3340 or #ABC';
  if (valid) {
    input.removeAttribute('aria-invalid');
    const digits = value.replace('#', '').toUpperCase();
    lastHex = '#' + (digits.length === 3 ? [...digits].map(c => c + c).join('') : digits);
  } else {
    input.setAttribute('aria-invalid', 'true');
  }
  const rgb = hexRgb(lastHex).map(channel => channel / 255);
  $('#input-swatch').style.background = lastHex;
  const rgbH=rgbHue(rgb),original=toOklch(rgb);
  const hues=generateHues(rgb,{fallback:Number($('#gray-hue').value)||0}).map(x=>({...x,family:colorFamily(x.h)}));
  $('#neutral-options').innerHTML=hues.map((x,i)=>{const C=maxChroma(.691,x.h),hex=hexFor(.691,C,x.h);return `<label class="hue-option" title="${x.family.name} · ${fmt(x.h,2)}° · ${ok(.691,C,x.h)}"><input type="radio" name="neutral-hue" value="${i}" ${i===selectedNeutral?'checked':''} aria-label="${x.family.name} ${fmt(x.h,1)}°"><span style="background:${hex}"></span></label>`;}).join('');
  document.querySelectorAll('[name="neutral-hue"]').forEach(r=>r.onchange=()=>{selectedNeutral=Number(r.value);render(selectedNeutral);});
  $('#gray-hue-label').hidden=rgbH!==null;
  const H=hues[selectedNeutral].h;rowId=0;
  const tokens = new Map();
  for (const [step, lightness] of graySteps) {
    tokens.set(`color-gray-${step}`, [lightness, 0, 0]);
    tokens.set(`color-neutral-${step}`, [lightness, step === 50 ? .00243 : .0064, H]);
  }

  const familyCounts = new Map();
  const palettes = hues.map(({h, family}) => {
    const name = family.name.toLowerCase();
    const count = (familyCounts.get(name) ?? 0) + 1;
    familyCounts.set(name, count);
    const prefix = `color-${name}${count > 1 ? '-' + count : ''}`;
    const red = Math.abs(mod(h - 359 + 180) - 180) <= 30;
    const steps = [
      [50, 98.3, family.fill], [200, 80.9, .0707],
      [500, 69.1, red ? .185 : .158], [600, 57.3, .185],
      [800, 50, .1143], [950, 26.4, .0437],
    ];
    for (const [step, lightness, chroma] of steps) {
      tokens.set(`${prefix}-${step}`, [lightness, chroma, h]);
    }
    return {h, prefix};
  });

  const roles = new Map();
  const alerts = new Map();
  const alertInk = new Map();
  const neutralAlert = recipeHex(colorRecipe(activeTheme, H, false)[2]);
  tokens.set('color-white', [100, 0, 0]);
  for (const {L, C, role} of neutralRecipe(activeTheme, H)) {
    const lightness = Number((L * 100).toFixed(2));
    const step = graySteps.find(([, level]) => level === lightness)?.[0];
    const token = L === 1 ? 'color-white' : `color-${C ? 'neutral' : 'gray'}-${step}`;
    roles.set(token, role);
  }
  for (const token of tokens.keys()) {
    if (/^color-(gray-|neutral-|white$)/.test(token)) alerts.set(token, neutralAlert);
  }
  for (const {h, prefix} of palettes) {
    const recipes = colorRecipe(activeTheme, h, false);
    const colorfulStep = recipes[1].L === .691 ? 500 : 600;
    const steps = activeTheme === 'light' ? [800, colorfulStep, 50] : [200, 500, 950];
    const [L, C, H] = tokens.get(`${prefix}-${steps[2]}`);
    const alert = recipeHex({L: L / 100, C, H});
    const [textL, textC, textH] = tokens.get(`${prefix}-${steps[0]}`);
    alertInk.set(`${prefix}-${steps[2]}`, recipeHex({L: textL / 100, C: textC, H: textH}));
    for (const [i, step] of steps.entries()) roles.set(`${prefix}-${step}`, recipes[i].role);
    for (const step of [50, 200, 500, 600, 800, 950]) alerts.set(`${prefix}-${step}`, alert);
  }
  const [tinted] = colorRecipe(activeTheme, H, false);
  document.documentElement.style.setProperty('--control-ink', ok(tinted.L, tinted.C, H));
  $('#theme-toggle').setAttribute('aria-pressed', String(activeTheme === 'dark'));
  document.documentElement.dataset.theme = activeTheme;
  renderMatrix(tokens, original, palettes.map(({prefix}) => prefix), roles, alerts, alertInk);
  exportCss = `:root {\n  --my-brand-color: ${lastHex};\n}\n\n@theme static {\n` +
    [...tokens].map(([name, [L, C, H]]) =>
      `  --${name}: oklch(${L}% ${fmt(C)} ${fmt(H, 4)});`
    ).join('\n') + '\n}\n';
  if(typeof restoreFocus==='number')document.querySelector(`[name="neutral-hue"][value="${restoreFocus}"]`).focus();
}
function hexRgb(hex){return hex.slice(1).match(/../g).map(v=>parseInt(v,16));}
const hslFields = [['h', 1, 359.9], ['s', 100, 100], ['l', 100, 100]];

function syncPicker() {
  const rgb = hexRgb(lastHex).map(channel => channel / 255);
  const max = Math.max(...rgb);
  const min = Math.min(...rgb);
  const l = (max + min) / 2;
  const s = max === min ? 0 : (max - min) / (1 - Math.abs(2 * l - 1));
  pickerHSL = {h: rgbHue(rgb) ?? pickerHSL.h, s, l};
  paintPicker();
}

function paintPicker() {
  const {h, s, l} = pickerHSL;
  const plane = $('#sl-plane');
  plane.style.backgroundColor = `hsl(${h} 100% 50%)`;
  $('#sl-marker').style.left = `${s * 100}%`;
  $('#sl-marker').style.top = `${(1 - l) * 100}%`;
  plane.setAttribute('aria-valuenow', Math.round(s * 100));
  plane.setAttribute('aria-valuetext', `S ${Math.round(s * 100)}%, L ${Math.round(l * 100)}%`);
  $('#picker-hue').value = h;
  for (const [channel, scale, max] of hslFields) {
    const input = $(`#hsl-${channel}`);
    if (document.activeElement !== input) input.value = Math.min(max, fmt(pickerHSL[channel] * scale, 1));
  }
}

function applyPicker() {
  const {h, s, l} = pickerHSL;
  const amplitude = s * Math.min(l, 1 - l);
  const rgb = [0, 8, 4].map(offset => {
    const k = (offset + h / 30) % 12;
    return Math.round(255 * (l - amplitude * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
  });
  $('#hex').value = '#' + rgb.map(channel => channel.toString(16).padStart(2, '0')).join('').toUpperCase();
  render();
  paintPicker();
}
function planePoint(e){const rect=$('#sl-plane').getBoundingClientRect();pickerHSL.s=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));pickerHSL.l=1-Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height));applyPicker();}
$('#hex').addEventListener('input',()=>{render();if(!$('#hex').hasAttribute('aria-invalid'))syncPicker();});
$('#hex').addEventListener('blur',()=>{if(!$('#hex').hasAttribute('aria-invalid'))$('#hex').value=lastHex;});
$('#gray-hue').oninput=render;
$('#hsl-toggle').onclick=()=>{const open=$('#hsl-panel').hidden;$('#hsl-panel').hidden=!open;$('#hsl-toggle').setAttribute('aria-expanded',String(open));if(open){closeHints();syncPicker();}};
$('#sl-plane').onpointerdown=e=>{if(!e.isPrimary||e.button>0)return;$('#sl-plane').setPointerCapture(e.pointerId);planePoint(e);};
$('#sl-plane').onpointermove=e=>{if($('#sl-plane').hasPointerCapture(e.pointerId))planePoint(e);};
$('#sl-plane').onpointerup=e=>{if($('#sl-plane').hasPointerCapture(e.pointerId))$('#sl-plane').releasePointerCapture(e.pointerId);};
$('#sl-plane').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const step=e.shiftKey?.1:.01;if(e.key==='ArrowLeft')pickerHSL.s=Math.max(0,pickerHSL.s-step);if(e.key==='ArrowRight')pickerHSL.s=Math.min(1,pickerHSL.s+step);if(e.key==='ArrowUp')pickerHSL.l=Math.min(1,pickerHSL.l+step);if(e.key==='ArrowDown')pickerHSL.l=Math.max(0,pickerHSL.l-step);applyPicker();};
$('#picker-hue').oninput=e=>{pickerHSL.h=Number(e.target.value);applyPicker();};
for (const [channel, scale, max] of hslFields) {
  const input = $(`#hsl-${channel}`);
  input.oninput = () => {
    if (Number.isNaN(input.valueAsNumber)) return;
    pickerHSL[channel] = Math.min(max, Math.max(0, input.valueAsNumber)) / scale;
    applyPicker();
  };
  input.onblur = () => { input.value = Math.min(max, fmt(pickerHSL[channel] * scale, 1)); };
}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.downloads'))$('.downloads').open=false;if(!e.target.closest('.hint-anchor'))closeHints();if(!e.target.closest('.hex-control')){$('#hsl-panel').hidden=true;$('#hsl-toggle').setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.downloads').open){$('.downloads').open=false;$('.downloads summary').focus();return;}document.querySelectorAll('.hint-anchor').forEach(a=>a.classList.add('suppressed'));closeHints();$('#hsl-panel').hidden=true;$('#hsl-toggle').setAttribute('aria-expanded','false');document.activeElement?.blur();}});
const initialHex = locationParams.get('hex');
if (/^#[a-f0-9]{6}$/i.test(initialHex ?? '')) $('#hex').value = initialHex;
const initialNeutral = Number(locationParams.get('neutral') ?? 4);
if (Number.isInteger(initialNeutral) && initialNeutral >= 0 && initialNeutral < 6) selectedNeutral = initialNeutral;
const fallback = Number(locationParams.get('fallback') ?? 0);
if (Number.isFinite(fallback) && fallback >= 0 && fallback < 360) $('#gray-hue').value = fallback;
function setTheme(theme) {
  activeTheme = theme;
  render();
}

$('#theme-toggle').onclick = () => setTheme(activeTheme === 'dark' ? 'light' : 'dark');
render();syncPicker();

$('#export-css').addEventListener('click', () => {
  $('.downloads').open = false;
  $('.downloads summary').focus();
  const url = URL.createObjectURL(new Blob([exportCss], {type: 'text/css'}));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'palette.theme.css';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body></html>
