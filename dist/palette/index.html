<script>const mod=x=>(x%360+360)%360;

function hslRgb(h,s=1,l=.5){const a=s*Math.min(l,1-l);return [0,8,4].map(n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));});}

  const v=colorValues(L,C,H),maxHex=hexFor(L,v.max,H),row=document.createElement('tr'),id='hint-'+rowId++;
  row.dataset.l=L;row.dataset.c=C;row.dataset.h=H;
  row.innerHTML=`<td class="sample-cell"><div class="hint-anchor"><button type="button" class="swatch" style="background:${v.hex}" aria-label="${family} ${role}: сведения о цвете" aria-expanded="false" aria-controls="${id}" aria-describedby="${id}"></button><div id="${id}" class="color-hint" role="tooltip"><div class="hint-heading"><b>${family} · ${role}</b><span>sRGB</span></div><div class="hint-values"><span>HEX</span><code>${v.hex}</code></div><div class="max-preview"><div class="swatch hint-max" style="background:${maxHex}" role="img" aria-label="Maximum Chroma ${maxHex}"></div><div><span>MAX Chroma</span><code>${fmt(v.max)}</code><code>${maxHex}</code></div></div><code class="max-oklch">${ok(L,v.max,H)}</code><div class="contrast-item"><span>WCAG / Blocks <i style="background:${background}"></i><code>${background}</code></span><b>${ratioText(v.hex,background)}</b></div><div class="contrast-item"><span>WCAG / Alerts <i style="background:${alert}"></i><code>${alert}</code></span><b>${ratioText(v.hex,alert)}</b></div>${v.outside?`<p class="gamut-note">Для HEX Chroma снижена до ${fmt(v.mapped)}. Исходный OKLCH сохранён.</p>`:''}<p class="hint-footnote">AA ≥ 4.5 · AAA ≥ 7 · обычный текст</p></div></div></td><td aria-label="Функция"><span class="family-name">${family}</span><span class="function-name">${role}</span></td><td class="divider-cell" aria-label="Цветной разделитель"><div class="color-divider" style="background:${v.hex}"></div></td><td class="oklch-value" aria-label="OKLCH">${ok(L,C,H)}</td>`;
  row.querySelector('.hint-anchor').onpointerleave=()=>row.querySelector('.hint-anchor').classList.remove('suppressed');
  row.querySelector('button').onclick=()=>{const anchor=row.querySelector('.hint-anchor'),was=anchor.classList.contains('pinned');anchor.classList.remove('suppressed');closeHints();if(!was){anchor.classList.add('pinned');anchor.querySelector('button').setAttribute('aria-expanded','true');}};
  return row;
}
function closeHints(){document.querySelectorAll('.hint-anchor.pinned').forEach(a=>{a.classList.remove('pinned');a.querySelector('button').setAttribute('aria-expanded','false');});}
function render(restoreFocus){
  let value=$('#hex').value.trim();
  if(!/^#?(?:[a-f\d]{3}|[a-f\d]{6})$/i.test(value)){$('#error').textContent='Введите HEX: #EF3340 или #ABC';$('#hex').setAttribute('aria-invalid','true');return;}
  $('#error').textContent='';$('#hex').removeAttribute('aria-invalid');value=value.replace('#','');if(value.length===3)value=[...value].map(c=>c+c).join('');
  const rgb=value.match(/../g).map(v=>parseInt(v,16)/255);lastHex='#'+value.toUpperCase();$('#input-swatch').style.background=lastHex;
  const rgbH=rgbHue(rgb),original=toOklch(rgb);
  const hues=generateHues(rgb,{fallback:Number($('#gray-hue').value)||0}).map(x=>({...x,family:colorFamily(x.h)}));
  $('#neutral-options').innerHTML=hues.map((x,i)=>{const C=maxChroma(.691,x.h),hex=hexFor(.691,C,x.h);return `<label class="hue-option" title="${x.family.name} · ${fmt(x.h,2)}° · ${ok(.691,C,x.h)}"><input type="radio" name="neutral-hue" value="${i}" ${i===selectedNeutral?'checked':''} aria-label="${x.family.name} ${fmt(x.h,1)}°"><span style="background:${hex}"></span></label>`;}).join('');
  document.querySelectorAll('[name="neutral-hue"]').forEach(r=>r.onchange=()=>{selectedNeutral=Number(r.value);render(selectedNeutral);});
  $('#gray-hue-label').hidden=rgbH!==null;
  const H=hues[selectedNeutral].h;rowId=0;
  for(const theme of ['light','dark']){
    const neutrals=neutralRecipe(theme,H),background=recipeHex(neutrals[1]),neutralAlert=recipeHex(colorRecipe(theme,H,false)[2]);
    const rows=neutrals.map(v=>tokenRow(v,'Neutral',background,neutralAlert));
    for(const hue of hues){const recipes=colorRecipe(theme,hue.h,false),alert=recipeHex(recipes[2]);rows.push(...recipes.map(v=>tokenRow(v,hue.family.name,background,alert)));}
    $(`#${theme}-rows`).replaceChildren(...rows);
  }
  if(typeof restoreFocus==='number')document.querySelector(`[name="neutral-hue"][value="${restoreFocus}"]`).focus();
}
function hexRgb(hex){return hex.slice(1).match(/../g).map(v=>parseInt(v,16));}
function syncPicker(){const rgb=hexRgb(lastHex).map(v=>v/255),max=Math.max(...rgb),min=Math.min(...rgb);pickerHSV={h:rgbHue(rgb)??pickerHSV.h,s:max===0?0:(max-min)/max,v:max};paintPicker();}
function paintPicker(){const {h,s,v}=pickerHSV;$('#sv-plane').style.backgroundColor=`hsl(${h} 100% 50%)`;$('#sv-marker').style.left=(s*100)+'%';$('#sv-marker').style.top=((1-v)*100)+'%';$('#sv-plane').setAttribute('aria-valuenow',Math.round(s*100));$('#sv-plane').setAttribute('aria-valuetext',`S ${Math.round(s*100)}%, V ${Math.round(v*100)}%`);$('#picker-hue').value=h;hexRgb(lastHex).forEach((v,i)=>{const input=$(['#rgb-r','#rgb-g','#rgb-b'][i]);if(document.activeElement!==input)input.value=v;});}
function applyPicker(){const {h,s,v}=pickerHSV;const k=n=>(n+h/60)%6;const rgb=[5,3,1].map(n=>Math.round(255*(v-v*s*Math.max(0,Math.min(k(n),4-k(n),1)))));lastHex='#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();$('#hex').value=lastHex;render();paintPicker();}
function planePoint(e){const rect=$('#sv-plane').getBoundingClientRect();pickerHSV.s=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));pickerHSV.v=1-Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height));applyPicker();}
$('#hex').addEventListener('input',()=>{render();if(!$('#hex').hasAttribute('aria-invalid'))syncPicker();});
$('#hex').addEventListener('blur',()=>{if(!$('#hex').hasAttribute('aria-invalid'))$('#hex').value=lastHex;});
$('#gray-hue').oninput=render;
$('#rgb-toggle').onclick=()=>{const open=$('#rgb-panel').hidden;$('#rgb-panel').hidden=!open;$('#rgb-toggle').setAttribute('aria-expanded',String(open));if(open){closeHints();syncPicker();}};
$('#sv-plane').onpointerdown=e=>{if(!e.isPrimary||e.button>0)return;$('#sv-plane').setPointerCapture(e.pointerId);planePoint(e);};
$('#sv-plane').onpointermove=e=>{if($('#sv-plane').hasPointerCapture(e.pointerId))planePoint(e);};
$('#sv-plane').onpointerup=e=>{if($('#sv-plane').hasPointerCapture(e.pointerId))$('#sv-plane').releasePointerCapture(e.pointerId);};
$('#sv-plane').onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const step=e.shiftKey?.1:.01;if(e.key==='ArrowLeft')pickerHSV.s=Math.max(0,pickerHSV.s-step);if(e.key==='ArrowRight')pickerHSV.s=Math.min(1,pickerHSV.s+step);if(e.key==='ArrowUp')pickerHSV.v=Math.min(1,pickerHSV.v+step);if(e.key==='ArrowDown')pickerHSV.v=Math.max(0,pickerHSV.v-step);applyPicker();};
$('#picker-hue').oninput=e=>{pickerHSV.h=Number(e.target.value);applyPicker();};
['#rgb-r','#rgb-g','#rgb-b'].forEach(id=>$(id).oninput=()=>{const nums=['#rgb-r','#rgb-g','#rgb-b'].map(s=>Math.round(Math.max(0,Math.min(255,Number($(s).value)))));$('#hex').value='#'+nums.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();render();syncPicker();});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.hint-anchor'))closeHints();if(!e.target.closest('.hex-control')){$('#rgb-panel').hidden=true;$('#rgb-toggle').setAttribute('aria-expanded','false');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.hint-anchor').forEach(a=>a.classList.add('suppressed'));closeHints();$('#rgb-panel').hidden=true;$('#rgb-toggle').setAttribute('aria-expanded','false');document.activeElement?.blur();}});
['#rgb-r','#rgb-g','#rgb-b'].forEach((id,i)=>$(id).onblur=()=>{$(id).value=hexRgb(lastHex)[i];});
render();syncPicker();
</script>
</body></html>
