#export-css {
  margin-top: 18px;
  padding: 9px 13px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #fff;
  color: #111;
}
table { max-width: 960px; }
.preview-col { width: 168px; }
.token-examples { display: flex; flex-wrap: wrap; gap: 6px; }
.token-examples span {
  padding: 4px 9px;
  border-radius: 6px;
  font-size: 11px;
}
.example-fill { background: var(--preview-color); color: var(--preview-ink); }
.example-border { border: 1px solid var(--preview-color); }
.family-name { overflow-wrap: anywhere; }
@media (max-width: 560px) {
  .preview-col { width: 68px; }
  .function-col { width: 100px; }
}

:root {
  --gray-50: oklch(98.3% 0 0);
  --gray-100: oklch(92.7% 0 0);
  --gray-200: oklch(80.9% 0 0);
  --gray-500: oklch(50% 0 0);
  --gray-700: oklch(30.9% 0 0);
  --gray-900: oklch(23.6% 0 0);
  --gray-950: oklch(19.1% 0 0);
  background: var(--gray-50);
  color: var(--gray-950);
}
.page-controls, .light-section, .hex-input, #hex, .rgb-panel, #export-css,
.color-hint { background: var(--gray-50); color: var(--gray-950); }
.dark-section, .dark-section .color-hint {
  background: var(--gray-900);
  color: var(--gray-50);
}
.hex-input, #export-css, .rgb-fields input { border-color: var(--gray-200); }
#matrix-link { color: inherit; margin-right: 16px; font-size: 13px; }
.button-col { width: min(55%, 320px); }
.token-examples { gap: 10px; }
.token-examples button {
  min-height: 48px;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 15px;
}
.example-fill { border: 1px solid var(--preview-color); }
.example-border { color: var(--preview-color); background: transparent; }
#palette-view .hint-anchor { width: auto; }
.oklch-value, .family-name { display: block; margin: 3px 0; }
#matrix { background: var(--blocks, white); }
#matrix p { font-size: 13px; }
.matrix-scroll { overflow-x: auto; }
.matrix-table { min-width: 735px; max-width: none; border-spacing: 6px; }
.matrix-table td { height: 50px; }
.matrix-table th { text-align: left; font-size: 12px; }
.matrix-table th:first-child { width: 85px; }
.matrix-swatch {
  display: block;
  width: 46px;
  height: 46px;
  border-radius: 10px;
  border: 1px solid #80808050;
}
.matrix-table .hint-anchor { width: 46px; }
.matrix-swatch[aria-pressed="true"] { outline: 2px solid currentColor; outline-offset: 2px; }
.hint-anchor:has(button:focus-visible) .color-hint { display: block; }
.matrix-table .color-hint {
  position: fixed;
  top: var(--hint-top, 12px);
  left: var(--hint-left, 12px);
  width: min(286px, calc(100vw - 24px));
  z-index: 100;
}
@media (max-width: 560px) {
  .button-col { width: 48%; }
  .token-examples button { padding-inline: 12px; }
}

.inputs .theme-toggle { display: inline-flex; align-items: center; gap: 7px; min-height: 48px; margin: 0; color: inherit; }
[data-theme="dark"], [data-theme="dark"] .page-controls,
[data-theme="dark"] .hex-input, [data-theme="dark"] #hex,
[data-theme="dark"] #export-css, [data-theme="dark"] .rgb-panel {
  background: var(--gray-900);
  color: var(--gray-50);
}
.matrix-table th:first-child { width: auto; }
.matrix-table th:last-child { width: 170px; }
.matrix-table td:last-child { font-size: 12px; }
.matrix-swatch[aria-pressed="true"] { outline: none; }
.matrix-swatch[aria-pressed="true"]::after {
  content: '';
  display: block;
  width: 7px;
  height: 7px;
  margin: auto;
  border-radius: 50%;
  background: currentColor;
}
.matrix-swatch:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }

:root, :root[data-theme], :root[data-theme] .page-controls,
.light-section, .dark-section { background: var(--page-blocks, #fff); }
#matrix { padding-top: 48px; }
.matrix-table { margin-top: 0; }
.matrix-table thead th {
  padding: 8px 0;
  color: inherit;
  overflow-wrap: anywhere;
}
.token-description { margin: 5px 0 0; font-size: 12px; overflow-wrap: anywhere; }

<header class="page-controls">
  <div class="controls-inner">
    <div class="inputs">
      <div class="hex-control"><div class="hex-input"><span id="input-swatch"></span><input id="hex" aria-label="Base HEX" value="#EF3340" maxlength="7" spellcheck="false" aria-describedby="error"><button id="rgb-toggle" type="button" aria-expanded="false" aria-controls="rgb-panel">RGB <span>⌄</span></button></div>

    </div>
    <a id="matrix-link" href="?view=matrix">Color matrix</a>
    <button id="export-css" type="button">Download Tailwind CSS</button>

</header>
<main id="palette-view">

  <section class="theme-section dark-section" aria-labelledby="dark-title"><div class="theme-inner"><h2 id="dark-title">Dark theme</h2><div class="table-scroll"><table aria-label="Dark palette: color details, role, OKLCH, and examples"><colgroup><col class="button-col"><col></colgroup><tbody id="dark-rows"></tbody></table></div></div></section>
</main>

    <div class="matrix-scroll">
      <table class="matrix-table"><thead><tr id="matrix-head"></tr></thead><tbody id="matrix-rows"></tbody></table>
    </div>
  </div>
</section>
<script>const mod=x=>(x%360+360)%360;
const anchors=[[0,0],[60,30],[120,60],[180,120],[240,240],[300,270],[360,360]];
function mapHue(h,inverse=false){h=mod(h);const a=anchors.map(p=>inverse?[p[1],p[0]]:p);for(let i=1;i<a.length;i++)if(h<=a[i][0])return a[i-1][1]+(h-a[i-1][0])/(a[i][0]-a[i-1][0])*(a[i][1]-a[i-1][1]);}
function hslRgb(h,s=1,l=.5){const a=s*Math.min(l,1-l);return [0,8,4].map(n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));});}
function rgbHue(rgb){const max=Math.max(...rgb),min=Math.min(...rgb),d=max-min;if(d<1e-9)return null;let h=max===rgb[0]?(rgb[1]-rgb[2])/d:max===rgb[1]?(rgb[2]-rgb[0])/d+2:(rgb[0]-rgb[1])/d+4;return mod(h*60);}
function toOklch(rgb){const [r,g,b]=rgb.map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);const L=.2104542553*l+.793617785*m-.0040720468*s,a=1.9779984951*l-2.428592205*m+.4505937099*s,bb=.0259040371*l+.7827717662*m-.808675766*s;return [L,Math.hypot(a,bb),mod(Math.atan2(bb,a)*180/Math.PI)];}
function linearRgb(L,C,H){const a=C*Math.cos(H*Math.PI/180),b=C*Math.sin(H*Math.PI/180),l=(L+.3963377774*a+.2158037573*b)**3,m=(L-.1055613458*a-.0638541728*b)**3,s=(L-.0894841775*a-1.291485548*b)**3;return [4.0767416621*l-3.3077115913*m+.2309699292*s,-1.2684380046*l+2.6097574011*m-.3413193965*s,-.0041960863*l-.7034186147*m+1.707614701*s];}
function inGamut(L,C,H){return linearRgb(L,C,H).every(v=>v>=0&&v<=1);}
function maxChroma(L,H){let lo=0,hi=.5;for(let i=0;i<38;i++){const mid=(lo+hi)/2;if(inGamut(L,mid,H))lo=mid;else hi=mid;}return Math.floor(lo*1e6)/1e6;}
function hexFor(L,C,H){return '#'+linearRgb(L,C,H).map(v=>{v=Math.max(0,Math.min(1,v));return Math.round(255*(v<=.0031308?12.92*v:1.055*v**(1/2.4)-.055)).toString(16).padStart(2,'0');}).join('').toUpperCase();}
function correction(base,h){const within=(v,a,b)=>v>=a&&v<b;let target=null,delta=0;if([0,60,180,240,300].some(a=>within(base,a,a+20))){target=120;delta=-30;}else if([20,80,140,200,260].some(a=>within(base,a,a+20))){target=320;delta=30;}else if(within(base,320,340)){target=260;delta=90;}else if(within(base,120,140)){target=180;delta=-90;}return target!==null&&within(h,target,target+20)?delta:0;}
// Mathematical reconstruction of the public Paletton color.wheel mapping.
// Source: https://paletton.com/js/app.compiled.js (color.wheel / color.class).
// Continuous angles and channels avoid the original UI's integer quantization.
const palettonSectors=[

  {end:180,origin:120,span:60,k:.5,order:[1,0,2],s0:1,s1:1,v0:1,v1:.8,reverse:true},
  {end:210,origin:210,span:-30,k:.75,order:[2,0,1],s0:1,s1:1,v0:.8,v1:.6,reverse:false},
  {end:255,origin:210,span:45,k:1.33,order:[2,1,0],s0:1,s1:.85,v0:.6,v1:.7,reverse:true},
  {end:315,origin:315,span:-60,k:1.33,order:[1,2,0],s0:.85,s1:1,v0:.7,v1:.65,reverse:false},

function palettonSector(h){return palettonSectors.find(x=>h<x.end);}
function palettonFraction(h){
  h=mod(h);if(h===0||h===180||h===255)return 0;
